<svg viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="290" rx="16" fill="#14110E"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#DDA24A"/>
    </marker>
  </defs>

  <!-- ROW 1 LABEL -->
  <text x="40" y="24" font-family="monospace" font-size="11" letter-spacing="1" fill="#DDA24A">SUBMIT &amp; PROCESS · ASYNC</text>

  <!-- ROW 1 ARROWS -->
  <line x1="140" y1="74" x2="160" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="260" y1="74" x2="280" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="74" x2="400" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="74" x2="520" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="74" x2="640" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="74" x2="760" y2="74" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- ROW 1 NODES -->
  <g font-family="sans-serif" text-anchor="middle">
    <!-- Browser -->
    <rect x="40" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="90" y="62" font-size="18">💻</text>
    <text x="90" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">BROWSER</text>
    <text x="90" y="95" font-size="8" fill="#A79C8D">reservation form</text>

    <!-- API Gateway Submit -->
    <rect x="160" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="210" y="62" font-size="18">🔗</text>
    <text x="210" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">API GATEWAY</text>
    <text x="210" y="95" font-size="8" fill="#A79C8D">POST /reserve</text>

    <!-- Lambda 1 -->
    <rect x="280" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="330" y="62" font-size="18">⚡</text>
    <text x="330" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">LAMBDA 1</text>
    <text x="330" y="95" font-size="8" fill="#A79C8D">order-submit</text>

    <!-- EventBridge -->
    <rect x="400" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="450" y="62" font-size="18">📡</text>
    <text x="450" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">EVENTBRIDGE</text>
    <text x="450" y="95" font-size="8" fill="#A79C8D">reserve-event-bus</text>

    <!-- SQS -->
    <rect x="520" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="570" y="62" font-size="18">📥</text>
    <text x="570" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">SQS QUEUE</text>
    <text x="570" y="95" font-size="8" fill="#A79C8D">ReservationQueue</text>

    <!-- Lambda 2 -->
    <rect x="640" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="690" y="62" font-size="18">⚙️</text>
    <text x="690" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">LAMBDA 2</text>
    <text x="690" y="95" font-size="8" fill="#A79C8D">order-processor</text>

    <!-- DynamoDB (row 1) -->
    <rect x="760" y="40" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.6"/>
    <text x="810" y="62" font-size="18">🗄️</text>
    <text x="810" y="82" font-size="10.5" font-weight="700" fill="#F4EFE7">DYNAMODB</text>
    <text x="810" y="95" font-size="8" fill="#A79C8D">reservationsTable</text>
  </g>

  <!-- VERTICAL CONNECTOR — same table -->
  <line x1="810" y1="108" x2="810" y2="190" stroke="#DDA24A" stroke-width="1.5" stroke-dasharray="3,4" opacity="0.5"/>

  <!-- ROW 2 LABEL -->
  <text x="40" y="174" font-family="monospace" font-size="11" letter-spacing="1" fill="#DDA24A">STATUS CHECK · POLLED EVERY 2.5S</text>

  <!-- ROW 2 ARROWS -->
  <line x1="140" y1="224" x2="280" y2="224" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="224" x2="520" y2="224" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>
  <line x1="620" y1="224" x2="760" y2="224" stroke="#DDA24A" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- ROW 2 NODES -->
  <g font-family="sans-serif" text-anchor="middle">
    <!-- Browser (polling) -->
    <rect x="40" y="190" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="90" y="212" font-size="18">🔁</text>
    <text x="90" y="232" font-size="10.5" font-weight="700" fill="#F4EFE7">BROWSER</text>
    <text x="90" y="245" font-size="8" fill="#A79C8D">polling loop</text>

    <!-- API Gateway Status -->
    <rect x="280" y="190" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="330" y="212" font-size="18">🔗</text>
    <text x="330" y="232" font-size="10.5" font-weight="700" fill="#F4EFE7">API GATEWAY</text>
    <text x="330" y="245" font-size="8" fill="#A79C8D">GET /status</text>

    <!-- Lambda 3 -->
    <rect x="520" y="190" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.35"/>
    <text x="570" y="212" font-size="18">🔍</text>
    <text x="570" y="232" font-size="10.5" font-weight="700" fill="#F4EFE7">LAMBDA 3</text>
    <text x="570" y="245" font-size="8" fill="#A79C8D">order-status</text>

    <!-- DynamoDB (row 2) -->
    <rect x="760" y="190" width="100" height="68" rx="10" fill="#1E1A16" stroke="#DDA24A" stroke-opacity="0.6"/>
    <text x="810" y="212" font-size="18">🗄️</text>
    <text x="810" y="232" font-size="10.5" font-weight="700" fill="#F4EFE7">DYNAMODB</text>
    <text x="810" y="245" font-size="8" fill="#A79C8D">reservationsTable</text>
  </g>

  <text x="450" y="278" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6E6459">Amber Table — Serverless Reservation Pipeline · Built by Teji · 2026</text>
</svg>

